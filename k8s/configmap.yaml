apiVersion: v1
kind: ConfigMap
metadata:
  name: sales-agent-config
  labels:
    app: sales-agent
data:
  SESSION_STORE: "redis"
  REDIS_URL: "redis://redis-service:6379/0"
  SESSION_TTL_SECONDS: "86400"
  DATA_PATH: "data/raw/sales.csv"
  AUTH_ENABLED: "true"
  AUTH_SERVICE_URL: "http://auth-service:8001"
  AUTH_USER: "admin"
  JWT_EXPIRATION_MINUTES: "60"
