apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-deployment
  labels:
    app: auth-service
    tier: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: auth
    spec:
      containers:
        - name: auth-service
          image: juliosilvacwb/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: AUTH_USER
              valueFrom:
                configMapKeyRef:
                  name: sales-agent-config
                  key: AUTH_USER
                  optional: true
            - name: JWT_EXPIRATION_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: sales-agent-config
                  key: JWT_EXPIRATION_MINUTES
                  optional: true
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sales-agent-secrets
                  key: auth-password
                  optional: true
            - name: RSA_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: sales-agent-secrets
                  key: rsa-private-key-pem
                  optional: true
            - name: RSA_PUBLIC_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: sales-agent-secrets
                  key: rsa-public-key-pem
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 3
            periodSeconds: 5
